name: Collect DTG portfolio activity

on:
  schedule:
    - cron: "17 0,12 * * *"
  push:
    branches: ["main"]
    paths:
      - "dtg_monitor/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Collection lookback window
        required: false
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dtg-portfolio-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      deployment_ref: ${{ steps.persist.outputs.deployment_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate configuration
        run: python -m dtg_monitor validate
      - name: Discover effective DTG repository scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_repositories.py
      - name: Collect activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ inputs.lookback_days || '7' }}
        run: python -m dtg_monitor collect --lookback-days "$LOOKBACK"
      - name: Generate reports
        run: |
          python -m dtg_monitor report --period daily
          python -m dtg_monitor report --period weekly
      - name: Bound generated evidence history
        run: python scripts/prune_evidence.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Persist generated outputs
        id: persist
        shell: bash
        run: |
          if git diff --quiet -- data reports docs/domain-brief.md docs/portfolio-status.md docs/dashboard.md docs/reports.md docs/repositories.md; then
            echo "No generated changes to commit."
          else
            git config user.name "dtg-portfolio-monitor[bot]"
            git config user.email "dtg-portfolio-monitor[bot]@users.noreply.github.com"
            git add data reports docs/domain-brief.md docs/portfolio-status.md docs/dashboard.md docs/reports.md docs/repositories.md
            git commit -m "chore(monitor): update DTG portfolio observations"

            pushed=false
            for attempt in 1 2 3; do
              echo "Persistence attempt $attempt/3"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Generated monitor evidence conflicts with newer main; refusing to overwrite either evidence set."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done

            if [ "$pushed" != "true" ]; then
              echo "::error::Could not persist generated monitor evidence after 3 fast-forward-safe retries."
              exit 1
            fi
          fi

          DEPLOYMENT_REF="$(git rev-parse HEAD)"
          echo "deployment_ref=$DEPLOYMENT_REF" >> "$GITHUB_OUTPUT"
          echo "Documentation deployment pinned to $DEPLOYMENT_REF"

  deploy-documentation:
    name: Build and deploy current documentation
    needs: collect
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.collect.outputs.deployment_ref }}
