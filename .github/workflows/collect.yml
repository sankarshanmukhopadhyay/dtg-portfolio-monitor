name: Collect DTG portfolio activity

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Collection lookback window
        required: false
        default: "7"
      persist_changes:
        description: Commit generated data and reports
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dtg-portfolio-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate configuration
        run: python -m dtg_monitor validate
      - name: Collect activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ inputs.lookback_days || '7' }}
        run: python -m dtg_monitor collect --lookback-days "$LOOKBACK"
      - name: Generate reports
        run: |
          python -m dtg_monitor report --period daily
          python -m dtg_monitor report --period weekly
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Commit generated outputs
        if: ${{ github.event_name == 'schedule' || inputs.persist_changes }}
        run: |
          if git diff --quiet -- data reports docs/portfolio-status.md; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "dtg-portfolio-monitor[bot]"
          git config user.email "dtg-portfolio-monitor[bot]@users.noreply.github.com"
          git add data reports docs/portfolio-status.md
          git commit -m "chore(monitor): update DTG portfolio observations"
          git push
