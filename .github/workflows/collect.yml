name: Collect DTG portfolio activity

on:
  schedule:
    - cron: "17 0,12 * * *"
  push:
    branches: ["main"]
    paths:
      - "dtg_monitor/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Collection lookback window
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dtg-portfolio-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      AUTO_TOKEN_PRESENT: ${{ secrets.MONITOR_AUTOMATION_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate configuration
        run: python -m dtg_monitor validate
      - name: Discover effective DTG repository scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_repositories.py
      - name: Resolve bounded unpublished observation window
        id: window
        env:
          REQUESTED_LOOKBACK: ${{ inputs.lookback_days || '7' }}
        run: >-
          python scripts/collection_window.py
          --requested-days "$REQUESTED_LOOKBACK"
          --github-output "$GITHUB_OUTPUT"
      - name: Collect activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ steps.window.outputs.lookback_days }}
        run: python -m dtg_monitor collect --lookback-days "$LOOKBACK"
      - name: Generate reports
        run: |
          python -m dtg_monitor report --period daily
          python -m dtg_monitor report --period weekly
      - name: Bound generated evidence history
        run: python scripts/prune_evidence.py
      - name: Run tests
        run: python -m unittest discover -s tests
      # Generated findings are derived evidence. They enter the protected default
      # branch only through the same PR and DCO gates as other contributions.
      - name: Propose generated evidence and site updates
        id: publication
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MONITOR_AUTOMATION_TOKEN || github.token }}
          branch: automation/monitor-observations
          delete-branch: true
          title: "chore(monitor): publish DTG portfolio observations"
          commit-message: "chore(monitor): publish DTG portfolio observations"
          committer: "dtg-portfolio-monitor[bot] <dtg-portfolio-monitor[bot]@users.noreply.github.com>"
          author: "dtg-portfolio-monitor[bot] <dtg-portfolio-monitor[bot]@users.noreply.github.com>"
          signoff: true
          add-paths: |
            data/**
            reports/**
            docs/domain-brief.md
            docs/portfolio-status.md
            docs/dashboard.md
            docs/reports.md
            docs/repositories.md
          body: |
            Generated DTG portfolio observations and report/site views.

            Source: scheduled or manually dispatched collection workflow.
            All source observations remain derived, with upstream sources authoritative.
            This PR must satisfy DCO and repository validation before merge.
            Once merged, the Pages push workflow deploys the reviewed site revision.

      - name: Publish collection status
        env:
          PR_NUMBER: ${{ steps.publication.outputs.pull-request-number }}
          PR_URL: ${{ steps.publication.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "Generated evidence proposed in $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Publication is pending PR checks and merge; RAHP must not consume unmerged evidence." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new generated evidence to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A GitHub App or PAT is necessary to cause normal pull_request checks to
      # run on automation-created PRs. Without it, keep the PR for human review.
      - name: Merge validated generated evidence when automation is authorized
        if: steps.publication.outputs.pull-request-number != '' && env.AUTO_TOKEN_PRESENT == 'true'
        env:
          GH_TOKEN: ${{ secrets.MONITOR_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.publication.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # The branch ruleset is the final authority; never bypass DCO or review.
          timeout 600 gh pr checks "$PR_NUMBER" --watch
          gh pr merge "$PR_NUMBER" --squash --delete-branch
