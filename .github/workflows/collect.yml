name: Collect DTG portfolio activity

on:
  schedule:
    - cron: "17 0,12 * * *"
  push:
    branches: ["main"]
    paths:
      - "dtg_monitor/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Collection lookback window
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dtg-portfolio-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository-scoped portfolio publication App
        env:
          APP_ID: ${{ vars.DTG_MONITOR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DTG_MONITOR_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${APP_ID:-}" =~ ^[1-9][0-9]*$ ]] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::error::DTG Monitor publication App ID variable or key secret missing; refuse collection before generating unpublishable source evidence"
            exit 1
          fi
      - name: Authenticate repository-scoped publication App
        id: publisher-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DTG_MONITOR_APP_ID }}
          private-key: ${{ secrets.DTG_MONITOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dtg-portfolio-monitor
          permission-contents: write
          permission-pull-requests: write
      - name: Resolve authenticated publication bot DCO identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.publisher-app.outputs.token }}
          APP_SLUG: ${{ steps.publisher-app.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq '.id')"
          [[ "$bot_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Publication App bot identity invalid"; exit 1; }
          echo "signature=${bot_login} <${bot_id}+${bot_login}@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate configuration
        run: python -m dtg_monitor validate
      - name: Discover effective DTG repository scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_repositories.py
      - name: Resolve bounded unpublished observation window
        id: window
        env:
          REQUESTED_LOOKBACK: ${{ inputs.lookback_days || '7' }}
        run: >-
          python scripts/collection_window.py
          --requested-days "$REQUESTED_LOOKBACK"
          --github-output "$GITHUB_OUTPUT"
      - name: Collect activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ steps.window.outputs.lookback_days }}
        run: python -m dtg_monitor collect --lookback-days "$LOOKBACK"
      - name: Generate reports
        run: |
          python -m dtg_monitor report --period daily
          python -m dtg_monitor report --period weekly
      - name: Bound generated evidence history
        run: python scripts/prune_evidence.py
      - name: Run tests
        run: python -m unittest discover -s tests
      # Generated findings are derived evidence. They enter the protected default
      # branch only through the same PR and DCO gates as other contributions.
      - name: Propose generated evidence and site updates
        id: publication
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.publisher-app.outputs.token }}
          branch: automation/monitor-observations
          delete-branch: true
          title: "chore(monitor): publish DTG portfolio observations"
          commit-message: "chore(monitor): publish DTG portfolio observations"
          committer: ${{ steps.bot.outputs.signature }}
          author: ${{ steps.bot.outputs.signature }}
          signoff: true
          add-paths: |
            data/**
            reports/**
            docs/domain-brief.md
            docs/portfolio-status.md
            docs/dashboard.md
            docs/reports.md
            docs/repositories.md
          body: |
            Generated DTG portfolio observations and report/site views.

            Source: scheduled or manually dispatched collection workflow.
            All source observations remain derived, with upstream sources authoritative.
            This PR must satisfy DCO and repository validation before merge.
            Once merged, the Pages push workflow deploys the reviewed site revision.

      - name: Publish collection status
        env:
          PR_NUMBER: ${{ steps.publication.outputs.pull-request-number }}
          PR_URL: ${{ steps.publication.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "Generated evidence proposed in $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Publication is pending PR checks and merge; RAHP must not consume unmerged evidence." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new generated evidence to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Native PR checks on a real merge candidate are required; the App
      # may merge only if normal protected-main rules and review permit.
      - name: Merge validated App-authored evidence under protected-main checks
        if: steps.publication.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.publisher-app.outputs.token }}
          PR_NUMBER: ${{ steps.publication.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # Native pull_request checks are created asynchronously after the
          # App-authored PR. A no-checks response is not a validation failure,
          # nor evidence that merge is safe: wait for the expected set first.
          ready=false
          for attempt in $(seq 1 45); do
            checks="$(gh pr checks "$PR_NUMBER" --json name --jq '.[].name' 2>/dev/null || true)"
            if grep -Eq '(^| / )DCO$' <<< "$checks" &&
               grep -Fxq 'validate' <<< "$checks" &&
               grep -Fxq 'pages-build' <<< "$checks"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "::error::Native PR checks were not registered; evidence remains unmerged"
            exit 1
          fi
          # Wait for all PR checks, then let branch rules enforce their results.
          # Never fabricate a status, force merge, or bypass required reviews.
          timeout 900 gh pr checks "$PR_NUMBER" --watch
          gh pr merge "$PR_NUMBER" --squash --delete-branch
