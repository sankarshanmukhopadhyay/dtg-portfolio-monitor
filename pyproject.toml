[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dtg-portfolio-monitor"
version = "0.3.1"
description = "Evidence-backed monitoring and reporting across DTG-related repositories"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
dtg-monitor = "dtg_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["dtg_monitor*"]
