version: 1
policy:
  public_only: true
  exclude_archived: true
  exclude_forks: true
  exclude_repositories:
    - sankarshanmukhopadhyay/dtg-portfolio-monitor
  allow_forks: []
  default_monitor:
    commits: true
    pull_requests: true
    issues: true
    releases: true
    discussions: false
  default_material_paths:
    - README.md
    - docs/**
    - spec/**
    - specs/**
    - schemas/**
    - '**/*spec*.md'
    - .github/workflows/**
sources:
  - owner: trustoverip
    prefixes: [dtgwg-]
    organisation: toip
    default_role: discovered-dtg-workstream
    default_weight: high
  - owner: OpenVTC
    prefixes: [dtg-]
    organisation: openvtc
    default_role: discovered-dtg-implementation
    default_weight: high
  - owner: sankarshanmukhopadhyay
    prefixes: [dtg-]
    organisation: independent
    default_role: assurance-or-implementation-profile
    default_weight: high
